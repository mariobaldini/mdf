name: Build, test, and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.distro }} build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:44
          - distro: ubuntu
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Install checkout and setup tools
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y make git git-lfs ca-certificates curl tar xz python3
          else
            apt-get update
            apt-get install -y --no-install-recommends make git git-lfs ca-certificates curl tar xz-utils python3
          fi

      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Trust the container checkout and submodules
        id: trust
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule foreach --recursive 'git config --global --add safe.directory "$PWD"'

      - name: Install the pinned Zig compiler
        run: |
          mdf_zig=$(python3 scripts/fetch-zig.py)
          printf '%s\n' "${mdf_zig%/zig}" >> "$GITHUB_PATH"

      - name: Fetch FLTK and Zig dependencies
        run: make setup

      - name: Build FLTK debug executable
        run: make build

      - name: Run core and installation tests
        run: make test

      - name: Run FLTK GUI tests without a desktop
        run: make test-gui OPTIMIZE=ReleaseFast

      - name: Set the main package revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf 'MDF_PACKAGE_RELEASE=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release executable
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: make release

      - name: Check RPM and DEB packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: make test-packages

      - name: Check the release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$(build/mdf --version)" = "mdf ${GITHUB_REF_NAME#v}"
          grep -Fq ".version = \"${GITHUB_REF_NAME#v}\"" build.zig.zon

      - name: Prepare release tag
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          mdf_tag=$GITHUB_REF_NAME
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            mdf_version=$(build/mdf --version)
            mdf_tag="v${mdf_version#mdf }-$GITHUB_RUN_NUMBER"
          fi
          printf 'tag=%s\n' "$mdf_tag" >> "$GITHUB_OUTPUT"

      - name: Transfer release files
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: mdf-linux-x86_64-${{ matrix.distro }}
          path: |
            build/mdf
            build/mdf.sha256
            build/build-info.txt
            build/*.rpm
            build/*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    if: needs.build.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: mdf-linux-x86_64-fedora
          path: build/fedora

      - uses: actions/download-artifact@v8
        with:
          name: mdf-linux-x86_64-ubuntu
          path: build/ubuntu

      - name: Verify both builds and select native packages
        run: python3 scripts/assemble-release.py "$RELEASE_TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/publish-release.sh "$RELEASE_TAG"
          bash scripts/publish-release.sh --promote
