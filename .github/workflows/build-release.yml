name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: dnf install -y make git git-lfs ca-certificates curl tar xz python3 strace cmake ninja-build gcc gcc-c++ libstdc++-static pkgconf-pkg-config pango-devel cairo-devel fontconfig-devel wayland-devel wayland-protocols-devel libxkbcommon-devel weston weston-devel dejavu-sans-mono-fonts rpm-build dpkg cpio

      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Install the pinned Zig compiler
        run: |
          mdf_zig_version=$(cat .zig-version)
          curl -fsSL https://ziglang.org/download/index.json |
            python3 -c 'import json, sys; p = json.load(sys.stdin)[sys.argv[1]]["x86_64-linux"]; print(p["tarball"]); print(p["shasum"])' "$mdf_zig_version" > "$RUNNER_TEMP/zig-download"
          mapfile -t mdf_package < "$RUNNER_TEMP/zig-download"
          curl -fsSL "${mdf_package[0]}" -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' "${mdf_package[1]}" "$RUNNER_TEMP/zig.tar.xz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          printf '%s\n' "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Fetch FLTK and Zig dependencies
        run: make setup

      - name: Build FLTK debug executable
        run: make build

      - name: Run core and installation tests
        run: make test

      - name: Run FLTK GUI tests without a desktop
        run: make test-gui OPTIMIZE=ReleaseFast

      - name: Build release executable
        run: make release

      - name: Check RPM and DEB packages
        run: make test-packages

      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "$(build/mdf --version)" = "mdf ${GITHUB_REF_NAME#v}"
          grep -Fq ".version = \"${GITHUB_REF_NAME#v}\"" build.zig.zon

      - uses: actions/upload-artifact@v7
        with:
          name: mdf-linux-x86_64
          path: |
            build/mdf
            build/mdf.sha256
            build/build-info.txt
            build/*.rpm
            build/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mdf-linux-x86_64
          path: build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Markdown FAST ${GITHUB_REF_NAME#v}" --generate-notes \
            build/mdf build/mdf.sha256 build/build-info.txt build/*.rpm build/*.deb
