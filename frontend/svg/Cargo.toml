[package]
name = "mdf-svg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
roxmltree = "=0.21.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

[profile.dev]
debug = "line-tables-only"
