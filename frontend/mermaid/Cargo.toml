[package]
name = "mdf-mermaid"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["mermaid", "svg"]
mermaid = ["dep:mermaid-rs-renderer"]
svg = ["dep:resvg", "dep:roxmltree"]

[dependencies]
mermaid-rs-renderer = { path = "../../zig-pkg/mermaid-renderer", default-features = false, optional = true }
resvg = { version = "=0.47.0", default-features = false, features = ["text"], optional = true }
roxmltree = { version = "=0.21.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

[profile.dev]
debug = "line-tables-only"
